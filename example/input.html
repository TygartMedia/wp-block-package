<h2>Packaging HTML for WordPress</h2>
<p>Plain paragraphs carry no explicit color rule. On a site whose theme sets <code>p{color:#fff}</code>, this text would render invisible — white on the article's cream background.</p>
<div class="callout"><p>The inheritance guard exists for exactly this case.</p></div>
